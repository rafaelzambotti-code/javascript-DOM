<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 9</title>
    <script>
        function mudarItem() {
            var item = document.querySelector("li")
            item.innerText = "Item alterado"
        }
    </script>
</head>
<body>
    <ul>
        <li>Primeiro item</li>
        <li>Segundo item</li>
        <li>Terceiro item</li>
    </ul>
    <button onclick="mudarItem()">Alterar primeiro item</button>
</body>
</html>
