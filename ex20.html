<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 20</title>
    <style>
        body {
            background-color: white;
            color: black;
        }
    </style>
    <script>
        function modoClaro() {
            var pagina = document.querySelector("body")
            pagina.style.backgroundColor = "white"
            pagina.style.color = "black"
        }
        function modoEscuro() {
            var pagina = document.querySelector("body")
            pagina.style.backgroundColor = "black"
            pagina.style.color = "white"
        }
    </script>
</head>
<body>
    <h1>Modo de visualização</h1>
    <button onclick="modoClaro()">Modo claro</button>
    <button onclick="modoEscuro()">Modo escuro</button>
</body>
</html>
