<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 18</title>
    <script>
        function deixarItalico() {
            var texto = document.querySelector("p")
            texto.style.fontStyle = "italic"
        }
    </script>
</head>
<body>
    <p>Este texto ficará em itálico.</p>
    <button onclick="deixarItalico()">Itálico</button>
</body>
</html>
