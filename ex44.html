<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 44</title>

    <script>
        function mostrarHora() {
            var hora = new Date()
            document.querySelector("h2").innerText = hora.toLocaleTimeString()
        }
    </script>
</head>
<body>
    <h2>--:--:--</h2>

    <button onclick="mostrarHora()">Mostrar hora</button>
</body>
</html>
