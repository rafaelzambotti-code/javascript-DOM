<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 52</title>

    <script>
        var numero = 1

        function proximaImagem() {
            numero = numero + 1

            if (numero > 3) {
                numero = 1
            }

            var imagem = document.querySelector("img")
            imagem.src = "assets/img/imagem " + numero + ".jpeg"
        }
    </script>
</head>
<body>
    <img src="assets/img/imagem 1.jpeg" width="300">

    <br><br>

    <button onclick="proximaImagem()">Próximo</button>
</body>
</html>
