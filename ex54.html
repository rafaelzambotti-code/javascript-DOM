<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 54</title>

    <script>
        function calcularDobro() {
            var numero = Number(document.querySelector("input").value)
            var dobro = numero * 2

            document.querySelector("p").innerText = dobro
        }
    </script>
</head>
<body>
    <input type="number">

    <button onclick="calcularDobro()">Calcular dobro</button>

    <p></p>
</body>
</html>
