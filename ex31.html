<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 31</title>

    <script>
        function adicionar() {
            var texto = document.querySelector("p")
            texto.innerHTML = texto.innerHTML + "<br>Nova linha adicionada"
        }
    </script>
</head>
<body>
    <p>Texto inicial</p>

    <button onclick="adicionar()">Adicionar linha</button>
</body>
</html>
