<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 40</title>

    <script>
        function alterarTextos() {
            var texto1 = document.querySelector("#texto1")
            var texto2 = document.querySelector("#texto2")
            var texto3 = document.querySelector("#texto3")

            texto1.innerText = "Alterado!"
            texto2.innerText = "Alterado!"
            texto3.innerText = "Alterado!"
        }
    </script>
</head>
<body>
    <p id="texto1">Primeiro parágrafo</p>
    <p id="texto2">Segundo parágrafo</p>
    <p id="texto3">Terceiro parágrafo</p>

    <button onclick="alterarTextos()">Alterar textos</button>
</body>
</html>
