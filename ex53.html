<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        function mostrarAlerta() {
            var texto = document.querySelector("input").value
            alert(texto)
        }

    <button onclick="mostrarAlerta()">Mostrar alerta</button>
</body>
