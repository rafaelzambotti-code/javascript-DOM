<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 33</title>
    <script>
        function removerItem() {
            var lista = document.querySelector("ul")
            var item = lista.lastElementChild

            item.remove()
        }
    </script>
</head>
<body>
    <ul>
        <li>Primeiro item</li>
        <li>Segundo item</li>
        <li>Terceiro item</li>
    </ul>

    <button onclick="removerItem()">Remover último</button>
</body>
</html>
