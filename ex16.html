<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 16</title>
    <script>
        function esconder() {
            var texto = document.querySelector("p")
            texto.style.display = "none"
        }
    </script>
</head>
<body>
    <p>Este parágrafo será escondido.</p>
    <button onclick="esconder()">Esconder</button>
</body>
</html>
