<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 13</title>
    <style>
        h1 {
            color: black;
        }
    </style>
    <script>
        function mudarCor() {
            var titulo = document.querySelector("h1")
            titulo.style.color = "red"
        }
    </script>
</head>
<body>
    <h1>Meu título</h1>
    <button onclick="mudarCor()">Mudar cor</button>
</body>
</html>
