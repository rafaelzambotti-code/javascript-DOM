<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 37</title>

    <script>
        function mudarTitulo() {
            var texto = document.querySelector("input").value
            document.querySelector("h1").innerText = texto
        }
    </script>
</head>
<body>
    <input type="text">

    <button onclick="mudarTitulo()">Mudar título</button>

    <h1>Título</h1>
</body>
</html>
