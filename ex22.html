<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Exercício 22</title>
    <script>
        var contador = 0
        function contar() {
            contador = contador + 1
            document.querySelector("#resultado").innerText = contador
        }
    </script>
</head>
<body>
    <button onclick="contar()">Clique</button>
    <p id="resultado">0</p>
</body>
</html>
