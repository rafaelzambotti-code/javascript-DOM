<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Exercício 43</title>

    <script>
        function alternar() {
            var texto = document.querySelector("p")

            if (texto.style.display == "none") {
                texto.style.display = "block"
            } else {
                texto.style.display = "none"
            }
        }
    </script>
</head>
<body>
    <p>Este texto pode ser escondido.</p>

    <button onclick="alternar()">Mostrar/Ocultar</button>
</body>
</html>
