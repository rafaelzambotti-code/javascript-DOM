<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 36</title>

    <script>
        var contador = 0

        function diminuir() {
            contador = contador - 1
            document.querySelector("#resultado").innerText = contador
        }
    </script>
</head>
<body>
    <p id="resultado">0</p>

    <button onclick="diminuir()">-1</button>
</body>
</html>
