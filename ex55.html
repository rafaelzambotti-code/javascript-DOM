<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Exercício 55</title>

    <style>
        div {
            width: 200px;
            height: 200px;
            border: 5px solid black;
        }
    </style>

    <script>
        function mudarBorda() {
            var quadrado = document.querySelector("div")
            quadrado.style.borderColor = "blue"
        }
    </script>
</head>
<body>
    <div></div>

    <button onclick="mudarBorda()">Mudar borda</button>
</body>
</html>
