<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 11</title>
    <style>
        body {
            background-color: white
        }
    </style>
    <script>
        function mudarCor() {
            var pagina = document.querySelector("body")
            pagina.style.backgroundColor = "blue"
        }
    </script>
</head>
<body>
    <button onclick="mudarCor()">Mudar para azul</button>
</body>
</html>
