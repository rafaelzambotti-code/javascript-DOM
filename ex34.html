<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 34</title>

    <script>
        function resetar() {
            var texto = document.querySelector("p")
            texto.innerText = "Texto resetado"
        }
    </script>
</head>
<body>
    <p>Texto que será alterado.</p>

    <button onclick="resetar()">Resetar</button>
</body>
</html>
