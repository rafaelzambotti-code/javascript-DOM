<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 8</title>
    <script>
        function mostrarData() {
            var data = new Date()
            document.querySelector("#resultado").innerText = data
        }
    </script>
</head>
<body>
    <p id="resultado"></p>
    <button onclick="mostrarData()">Mostrar data e hora</button>
</body>
</html>
