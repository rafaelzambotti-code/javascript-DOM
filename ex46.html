<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 46</title>

    <script>
        function mostrarTexto() {
            var texto = document.querySelector("input").value
            document.querySelector("p").innerText = texto
        }
    </script>
</head>
<body>
    <input type="text">

    <button onclick="mostrarTexto()">Mostrar texto</button>

    <p></p>
</body>
</html>
