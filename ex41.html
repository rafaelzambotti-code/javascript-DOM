<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Exercício 41</title>

    <style>
        div {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: gray;
        }
    </style>

    <script>
        function vermelho() {
            var semaforo = document.querySelector("div")
            semaforo.style.backgroundColor = "red"
        }

        function amarelo() {
            var semaforo = document.querySelector("div")
            semaforo.style.backgroundColor = "yellow"
        }

        function verde() {
            var semaforo = document.querySelector("div")
            semaforo.style.backgroundColor = "green"
        }
    </script>
</head>
<body>
    <div></div>

    <button onclick="vermelho()">Vermelho</button>
    <button onclick="amarelo()">Amarelo</button>
    <button onclick="verde()">Verde</button>
</body>
</html>
